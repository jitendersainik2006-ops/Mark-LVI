<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS Mark LVI — Access</title>
  <link rel="stylesheet" href="/static/jarvis_design_tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Stonic-Inspired Design Tokens */
      --dark-bg: #050508;
      --surface-1: rgba(255, 255, 255, .02);
      --surface-2: rgba(255, 255, 255, .04);
      --surface-3: rgba(255, 255, 255, .07);
      --border-subtle: rgba(255, 255, 255, .06);
      --border-medium: rgba(255, 255, 255, .1);
      --border-strong: rgba(255, 255, 255, .16);
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-muted: #86868b;
      --accent-gold: #d4a853;
      --accent-gold-soft: rgba(212, 168, 83, .15);
      --accent-blue: #5b8def;
      --accent-blue-soft: rgba(91, 141, 239, .1);
      --accent-cta: #ff6600;
      --radius-lg: 1.25rem;
      --radius-xl: 1.75rem;
      --radius-2xl: 2.25rem;
      --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
      --ease-apple: cubic-bezier(.4, 0, .2, 1);

      /* Functional Palette Aliases */
      --bg:     var(--dark-bg);
      --card:   var(--surface-2);
      --border: var(--border-subtle);
      --accent: var(--accent-gold);
      --adim:   var(--accent-gold-soft);
      --text:   var(--text-primary);
      --muted:  var(--text-muted);
      --success:#10b981;
      --danger: #f87171;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }
    .card {
      width: 380px;
      max-width: 95vw;
      padding: 36px 30px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 10px;
      margin-bottom: 6px;
    }
    .logo em { color: var(--accent); font-style: normal; }
    .sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .tab-bar {
      display: flex;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--adim);
      color: #fff;
      border-bottom: 2px solid var(--accent);
    }
    .tab-content { display: none; text-align: left; }
    .tab-content.active { display: block; }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 20px;
      text-align: center;
    }
    .input-group {
      margin-bottom: 14px;
    }
    .input-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      display: block;
      letter-spacing: 0.5px;
    }
    .field-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.15s;
    }
    .field-input:focus {
      border-color: var(--accent);
      background: var(--adim);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .key-input {
      width: 100%;
      padding: 16px 10px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 24px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 6px;
      text-transform: uppercase;
      outline: none;
      transition: all 0.15s;
      caret-color: var(--accent);
      margin-bottom: 14px;
    }
    .key-input:focus {
      border-color: var(--accent);
      background: var(--adim);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .err {
      font-size: 12px;
      color: var(--danger);
      min-height: 18px;
      margin-bottom: 12px;
      text-align: center;
    }
    .msg-ok {
      font-size: 12px;
      color: var(--success);
      min-height: 18px;
      margin-bottom: 12px;
      text-align: center;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      text-transform: uppercase;
    }
    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      margin-top: 8px;
      border: 1px solid var(--border);
    }
    .btn-success { background: var(--success); }
    .link-row {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 11px;
    }
    .link-row a {
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }
    .link-row a:hover { color: var(--accent); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
      text-align: left;
    }
    .voice-note code {
      background: rgba(255,255,255,0.07);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
    }
    #reconnecting {
      display: none;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="sub">Mark LVI Companion</div>
    <p id="reconnecting">Reconnecting…</p>

    <!-- Tab Navigation -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-btn-pin" onclick="switchTab('pin')">PIN / REMOTE</button>
      <button class="tab-btn" id="tab-btn-user" onclick="switchTab('user')">USER ACCOUNT</button>
    </div>

    <!-- TAB 1: PIN / REMOTE ACCESS -->
    <div class="tab-content active" id="tab-pin">
      <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the JARVIS app to get a session key or QR code.</p>
      <input class="key-input" id="key" type="text" maxlength="9"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · · · ·">
      <div class="err" id="pin-err"></div>
      <button class="btn" onclick="doLogin()">CONNECT VIA KEY</button>
      <button class="btn btn-success" id="local-login-btn" style="display:none;margin-top:10px;" onclick="doLocalLogin()">💻 OPEN LOCAL DASHBOARD</button>
      <p class="voice-note">
        🎤 <strong style="color:var(--text)">Voice on Android:</strong> open
        <code>chrome://flags</code>, enable <code>Insecure origins treated as secure</code>, add your JARVIS URL, tap Relaunch.
      </p>
    </div>

    <!-- TAB 2: USER ACCOUNT (LOGIN / REGISTER / VERIFY) -->
    <div class="tab-content" id="tab-user">
      <!-- SUB-VIEW: LOGIN -->
      <div id="view-login">
        <div class="input-group">
          <label class="input-label">USERNAME OR EMAIL</label>
          <input class="field-input" id="user-login-id" type="text" placeholder="e.g. jarvis_user" autocomplete="username">
        </div>
        <div class="input-group">
          <label class="input-label">PASSWORD</label>
          <input class="field-input" id="user-login-pw" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="err" id="user-err"></div>
        <button class="btn" onclick="doUserLogin()">SIGN IN</button>
        <button class="btn btn-secondary" onclick="showSubView('register')">CREATE NEW ACCOUNT</button>
        <div class="link-row">
          <a onclick="showSubView('verify')">Verify Code</a>
          <a onclick="showSubView('reset')">Forgot Password?</a>
        </div>
      </div>

      <!-- SUB-VIEW: REGISTER -->
      <div id="view-register" style="display:none;">
        <div class="input-group">
          <label class="input-label">USERNAME</label>
          <input class="field-input" id="reg-username" type="text" placeholder="alphanumeric, min 3 chars">
        </div>
        <div class="input-group">
          <label class="input-label">DISPLAY NAME (OPTIONAL)</label>
          <input class="field-input" id="reg-name" type="text" placeholder="Your Name">
        </div>
        <div class="input-group">
          <label class="input-label">EMAIL (OPTIONAL FOR OFFLINE MODE)</label>
          <input class="field-input" id="reg-email" type="email" placeholder="user@example.com">
        </div>
        <div class="input-group">
          <label class="input-label">PASSWORD</label>
          <input class="field-input" id="reg-pw" type="password" placeholder="min 6 characters">
        </div>
        <div style="margin-bottom:14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="reg-local" checked style="accent-color:var(--accent);">
          <label for="reg-local">Local-Only Mode (Offline / No SMTP)</label>
        </div>
        <div class="err" id="reg-err"></div>
        <div class="msg-ok" id="reg-ok"></div>
        <button class="btn" onclick="doRegister()">REGISTER ACCOUNT</button>
        <button class="btn btn-secondary" onclick="showSubView('login')">BACK TO SIGN IN</button>
      </div>

      <!-- SUB-VIEW: VERIFY -->
      <div id="view-verify" style="display:none;">
        <div class="input-group">
          <label class="input-label">USERNAME OR EMAIL</label>
          <input class="field-input" id="verify-id" type="text" placeholder="username or email">
        </div>
        <div class="input-group">
          <label class="input-label">6-DIGIT VERIFICATION CODE</label>
          <input class="field-input" id="verify-code" type="text" maxlength="6" placeholder="123456" style="text-align:center;letter-spacing:4px;font-weight:700;">
        </div>
        <div class="err" id="verify-err"></div>
        <div class="msg-ok" id="verify-ok"></div>
        <button class="btn" onclick="doVerifyCode()">VERIFY CODE</button>
        <button class="btn btn-secondary" onclick="doResendCode()">RESEND CODE</button>
        <button class="btn btn-secondary" onclick="showSubView('login')">BACK TO SIGN IN</button>
      </div>

      <!-- SUB-VIEW: RESET PASSWORD -->
      <div id="view-reset" style="display:none;">
        <div class="input-group">
          <label class="input-label">USERNAME OR EMAIL</label>
          <input class="field-input" id="reset-id" type="text" placeholder="username or email">
        </div>
        <div class="err" id="reset-err"></div>
        <div class="msg-ok" id="reset-ok"></div>
        <button class="btn" onclick="doRequestReset()">REQUEST RESET TOKEN</button>
        <div id="reset-pw-section" style="display:none;margin-top:14px;">
          <div class="input-group">
            <label class="input-label">RESET TOKEN</label>
            <input class="field-input" id="reset-token" type="text" placeholder="paste token here">
          </div>
          <div class="input-group">
            <label class="input-label">NEW PASSWORD</label>
            <input class="field-input" id="reset-new-pw" type="password" placeholder="min 6 chars">
          </div>
          <button class="btn btn-success" onclick="doResetPassword()">SET NEW PASSWORD</button>
        </div>
        <button class="btn btn-secondary" onclick="showSubView('login')">BACK TO SIGN IN</button>
      </div>
    </div>
  </div>

  <script>
    // Tab switching
    function switchTab(t) {
      document.getElementById('tab-btn-pin').classList.toggle('active', t === 'pin');
      document.getElementById('tab-btn-user').classList.toggle('active', t === 'user');
      document.getElementById('tab-pin').classList.toggle('active', t === 'pin');
      document.getElementById('tab-user').classList.toggle('active', t === 'user');
      clearErrors();
    }

    function showSubView(v) {
      document.getElementById('view-login').style.display = (v === 'login') ? 'block' : 'none';
      document.getElementById('view-register').style.display = (v === 'register') ? 'block' : 'none';
      document.getElementById('view-verify').style.display = (v === 'verify') ? 'block' : 'none';
      document.getElementById('view-reset').style.display = (v === 'reset') ? 'block' : 'none';
      clearErrors();
    }

    function clearErrors() {
      ['pin-err', 'user-err', 'reg-err', 'verify-err', 'reset-err', 'reg-ok', 'verify-ok', 'reset-ok'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '';
      });
    }

    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    if (inp) {
      inp.focus();
      inp.addEventListener('input', () => {
        inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9 -]/g, '');
        const clean = inp.value.replace(/[^A-Z2-9]/g, '');
        if (clean.length === 8) doLogin();
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    }

    function shakeCard() {
      const card = document.getElementById('card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }

    async function doLogin() {
      const cleanKey = inp.value.trim().toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (cleanKey.length < 8) { shakeCard(); return; }
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: cleanKey })
        });
        const data = await r.json();
        if (data.ok && data.token) {
          sessionStorage.setItem('jarvis_key', cleanKey);
          sessionStorage.setItem('jarvis_token', data.token);
          location.href = '/';
        } else {
          inp.value = '';
          inp.focus();
          document.getElementById('pin-err').textContent = (data && data.error) ? data.error : 'Invalid or expired key';
          shakeCard();
        }
      } catch (e) {
        document.getElementById('pin-err').textContent = 'Connection error';
        shakeCard();
      }
    }

    async function doLocalLogin() {
      try {
        const r = await fetch('/api/local-login', { method: 'POST' });
        const data = await r.json();
        if (data && data.ok && data.token) {
          sessionStorage.setItem('jarvis_key', data.key || 'LOCALHOST');
          sessionStorage.setItem('jarvis_token', data.token);
          location.href = '/';
        } else {
          document.getElementById('pin-err').textContent = (data && data.error) ? data.error : 'Local login failed';
        }
      } catch (e) {
        document.getElementById('pin-err').textContent = 'Connection error';
      }
    }

    // ── User Account Handlers ────────────────────────────────────────────────

    async function doUserLogin() {
      clearErrors();
      const target = document.getElementById('user-login-id').value.trim();
      const pw = document.getElementById('user-login-pw').value;
      if (!target || !pw) {
        document.getElementById('user-err').textContent = 'Username and password required.';
        shakeCard();
        return;
      }
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email_or_username: target, password: pw })
        });
        const data = await r.json();
        if (data.ok && data.token) {
          sessionStorage.setItem('jarvis_key', 'USER_SESSION');
          sessionStorage.setItem('jarvis_token', data.token);
          if (data.user) {
            sessionStorage.setItem('jarvis_user', JSON.stringify(data.user));
          }
          location.href = '/';
        } else {
          document.getElementById('user-err').textContent = data.error || 'Login failed.';
          shakeCard();
        }
      } catch (e) {
        document.getElementById('user-err').textContent = 'Connection error';
        shakeCard();
      }
    }

    async function doRegister() {
      clearErrors();
      const uname = document.getElementById('reg-username').value.trim();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pw = document.getElementById('reg-pw').value;
      const localOnly = document.getElementById('reg-local').checked;

      if (!uname || uname.length < 3) {
        document.getElementById('reg-err').textContent = 'Username must be at least 3 characters.';
        return;
      }
      if (!pw || pw.length < 6) {
        document.getElementById('reg-err').textContent = 'Password must be at least 6 characters.';
        return;
      }

      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: uname,
            display_name: name,
            email: email,
            password: pw,
            local_only: localOnly,
          })
        });
        const data = await r.json();
        if (data.ok) {
          let okMsg = data.message || 'Registration successful!';
          if (data.verification_code) {
            okMsg += ' Local code: ' + data.verification_code;
          }
          document.getElementById('reg-ok').textContent = okMsg;
          setTimeout(() => {
            document.getElementById('user-login-id').value = uname;
            showSubView('login');
          }, 2500);
        } else {
          document.getElementById('reg-err').textContent = data.error || 'Registration failed.';
          shakeCard();
        }
      } catch (e) {
        document.getElementById('reg-err').textContent = 'Connection error';
        shakeCard();
      }
    }

    async function doVerifyCode() {
      clearErrors();
      const target = document.getElementById('verify-id').value.trim();
      const code = document.getElementById('verify-code').value.trim();
      if (!target || !code) {
        document.getElementById('verify-err').textContent = 'Account ID and 6-digit code required.';
        return;
      }
      try {
        const r = await fetch('/api/auth/verify_email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email_or_username: target, code: code })
        });
        const data = await r.json();
        if (data.ok) {
          document.getElementById('verify-ok').textContent = 'Email verified! Redirecting to login…';
          setTimeout(() => {
            document.getElementById('user-login-id').value = target;
            showSubView('login');
          }, 1500);
        } else {
          document.getElementById('verify-err').textContent = data.error || 'Verification failed.';
        }
      } catch (e) {
        document.getElementById('verify-err').textContent = 'Connection error';
      }
    }

    async function doResendCode() {
      clearErrors();
      const target = document.getElementById('verify-id').value.trim();
      if (!target) {
        document.getElementById('verify-err').textContent = 'Enter username or email to resend code.';
        return;
      }
      try {
        const r = await fetch('/api/auth/resend_verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email_or_username: target })
        });
        const data = await r.json();
        if (data.ok) {
          let msg = data.message || 'Code sent!';
          if (data.verification_code) msg += ' Local code: ' + data.verification_code;
          document.getElementById('verify-ok').textContent = msg;
        } else {
          document.getElementById('verify-err').textContent = data.error || 'Failed to resend code.';
        }
      } catch (e) {
        document.getElementById('verify-err').textContent = 'Connection error';
      }
    }

    async function doRequestReset() {
      clearErrors();
      const target = document.getElementById('reset-id').value.trim();
      if (!target) {
        document.getElementById('reset-err').textContent = 'Enter username or email.';
        return;
      }
      try {
        const r = await fetch('/api/auth/request_reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email_or_username: target })
        });
        const data = await r.json();
        if (data.ok) {
          let msg = data.message || 'Reset token generated.';
          if (data.reset_token) {
            msg += ' Token: ' + data.reset_token;
            document.getElementById('reset-token').value = data.reset_token;
          }
          document.getElementById('reset-ok').textContent = msg;
          document.getElementById('reset-pw-section').style.display = 'block';
        } else {
          document.getElementById('reset-err').textContent = data.error || 'Reset request failed.';
        }
      } catch (e) {
        document.getElementById('reset-err').textContent = 'Connection error';
      }
    }

    async function doResetPassword() {
      clearErrors();
      const token = document.getElementById('reset-token').value.trim();
      const pw = document.getElementById('reset-new-pw').value;
      if (!token || !pw || pw.length < 6) {
        document.getElementById('reset-err').textContent = 'Valid token and new password (min 6 chars) required.';
        return;
      }
      try {
        const r = await fetch('/api/auth/reset_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset_token: token, new_password: pw })
        });
        const data = await r.json();
        if (data.ok) {
          document.getElementById('reset-ok').textContent = 'Password reset! Redirecting to login…';
          setTimeout(() => showSubView('login'), 1500);
        } else {
          document.getElementById('reset-err').textContent = data.error || 'Reset failed.';
        }
      } catch (e) {
        document.getElementById('reset-err').textContent = 'Connection error';
      }
    }

    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      const btn = document.getElementById('local-login-btn');
      if (btn) btn.style.display = 'block';
