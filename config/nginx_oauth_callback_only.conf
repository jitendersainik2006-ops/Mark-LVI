# nginx_oauth_callback_only.conf — Secure Reverse Proxy Configuration
#
# PURPOSE:
# Routes ONLY the Meta OAuth redirect callback to J.A.R.V.I.S. on local port 8000.
# ALL other routes (Dashboard UI, Chat, Settings, WebSocket, Files) are strictly BLOCKED (HTTP 403).
#
# USAGE:
# 1. Replace 'jarvis-oauth.yourdomain.com' with your actual owned domain.
# 2. Configure your SSL certificate and key paths (e.g. from Certbot).
# 3. Reload nginx: nginx -s reload

server {
    listen 443 ssl http2;
    server_name jarvis-oauth.yourdomain.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Allow ONLY the exact Meta OAuth callback path
    location = /api/instagram/oauth/callback {
        proxy_pass http://127.0.0.1:8000/api/instagram/oauth/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Block and reject all other dashboard, API, and WebSocket requests
    location / {
        return 403 "Access Denied: J.A.R.V.I.S. dashboard is private.\n";
    }
}
